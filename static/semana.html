<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¿Qué tal la semana? · Playlist Lab</title>
<style>
  :root { --bg:#121212; --panel:#1e1e1e; --panel2:#282828; --text:#eaeaea; --muted:#9a9a9a; --accent:#1db954; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  .wrap { max-width:760px; margin:0 auto; padding:24px 16px 80px; }
  h1 { font-size:24px; margin:0 0 4px; } h1 span { color:var(--accent); }
  h2 { font-size:15px; color:var(--muted); font-weight:600; margin:28px 0 10px; text-transform:uppercase; letter-spacing:.04em; }
  .muted { color:var(--muted); font-size:13px; }
  .disco { background:var(--panel); border-radius:12px; padding:14px 16px; margin-bottom:10px; }
  .disco.hecho { opacity:.55; }
  .titulo { font-weight:650; } .artista { color:var(--muted); font-size:14px; }
  .botones { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .botones button { background:var(--panel2); color:var(--text); border:1px solid #3a3a3a; border-radius:999px; padding:6px 12px; font-size:13px; cursor:pointer; }
  .botones button:hover { border-color:var(--accent); }
  .botones button.elegido { background:var(--accent); color:#062b12; border-color:var(--accent); font-weight:700; }
  input.nota { width:100%; margin-top:8px; background:var(--panel2); color:var(--text); border:1px solid #3a3a3a; border-radius:8px; padding:7px 10px; font-size:13px; }
  .vacio { background:var(--panel); border-radius:12px; padding:24px; text-align:center; color:var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <h1>¿Qué tal <span>la semana</span>?</h1>
  <div class="muted">Un clic por disco. Si quieres, añade por qué: es lo que más sirve la próxima vez. Se guarda al momento.</div>
  <div id="listas"></div>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ETIQUETA = {"me encanta":"🔥 Me encanta","me gusta":"🙂 A gusto","sin pena ni gloria":"😐 Sin pena ni gloria",
  "no es para mí pero lo entiendo":"🧠 No es para mí, pero lo entiendo","no es lo mío":"😵 No es lo mío","nunca más":"⛔ Nunca más"};

async function guardar(card, artista, album, veredicto) {
  const nota = card.querySelector("input.nota").value.trim();
  const r = await fetch("/api/opinion", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({artista, album, veredicto, nota})});
  if (!r.ok) { alert("No se pudo guardar"); return; }
  card.querySelectorAll(".botones button").forEach(b => b.classList.toggle("elegido", b.dataset.v === veredicto));
  card.classList.add("hecho");
}

async function cargar() {
  const d = await (await fetch("/api/pendientes")).json();
  if (!d.listas.length) { $("listas").innerHTML = '<div class="vacio" style="margin-top:24px">No hay discos pendientes de valorar. 🎉</div>'; return; }
  $("listas").innerHTML = d.listas.map(g => `<h2>${esc(g.lista)}</h2>` + g.albumes.map(a => `
    <div class="disco" data-artista="${esc(a.artista)}" data-album="${esc(a.album)}">
      <div class="titulo">${esc(a.album)}</div><div class="artista">${esc(a.artista)}</div>
      <div class="botones">${d.veredictos.map(v => `<button data-v="${esc(v)}">${esc(ETIQUETA[v] || v)}</button>`).join("")}</div>
      <input class="nota" placeholder="¿Por qué? (opcional)">
    </div>`).join("")).join("");
  document.querySelectorAll(".disco").forEach(card => card.querySelectorAll(".botones button").forEach(b =>
    b.onclick = () => guardar(card, card.dataset.artista, card.dataset.album, b.dataset.v)));
}
cargar();
</script>
</body>
</html>
